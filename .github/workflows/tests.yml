name: Quality Gates

# Keep this entry point at the pre-existing, default-branch workflow path so
# GitHub dispatches it for the PR that introduces the complete gate. The
# implementation is split out so the established CI orchestrator can also
# call the same complete matrix after this PR lands.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  complete-matrix:
    uses: ./.github/workflows/quality-gates.yml
